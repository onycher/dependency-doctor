version: '3.8'

services:
  dependency-doctor-cli:
    build: .
    command: python main.py --help
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1

  dependency-doctor-web:
    build: .
    command: python main.py --mode web
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000

  dependency-doctor-api:
    build: .
    command: python main.py --mode api  
    ports:
      - "8001:8001"
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - API_HOST=0.0.0.0
      - API_PORT=8001