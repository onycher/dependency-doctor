[project]
name = "dependency-doctor"
version = "0.1.0"
description = "A comprehensive tool for analyzing, monitoring, and managing Python project dependencies with security scanning and update checking."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "onycher", email = "928520+onycher@users.noreply.github.com"}
]
maintainers = [
    {name = "onycher", email = "928520+onycher@users.noreply.github.com"}
]
keywords = ["dependencies", "security", "python", "packaging", "vulnerability", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance"
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.2.1",
    "fastapi>=0.116.1",
    "pip-audit>=2.9.0",
    "pygithub>=2.6.1",
    "pytest>=8.4.1",
    "python-dotenv>=1.1.1",
    "rio-ui>=0.11.1",
    "ruff>=0.12.5",
    "structlog>=25.4.0",
    "toml>=0.10.2",
    "packaging>=23.0",
    "requests>=2.31.0",
    "prettytable>=3.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.0.0",
    "pre-commit>=3.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
]

[project.scripts]
dependency-doctor = "src.controllers.cli_controller:cli"

[project.urls]
"Homepage" = "https://github.com/onycher/dependency-doctor"
"Bug Reports" = "https://github.com/onycher/dependency-doctor/issues"
"Source" = "https://github.com/onycher/dependency-doctor"
"Documentation" = "https://github.com/onycher/dependency-doctor#readme"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "PT"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
